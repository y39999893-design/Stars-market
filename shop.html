<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stars Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0c14;--s1:#111522;--s2:#171c2e;--line:#232940;--or:#ff6a00;--or2:#e85500;--tx:#eef0f6;--mu:#7c859c;--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:20px}
.brand i{font-style:normal;font-size:24px}
.pill{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 5px;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-weight:700}
main{padding:14px 16px}
.hero{border-radius:var(--r);padding:22px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero h2{font-size:21px}
.hero p{color:#ffffffc4;font-size:13px;margin-top:4px}
.hero b{font-size:40px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:5px;margin-bottom:16px}
.tabs button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;font-size:13px;padding:12px 4px;border-radius:13px}
.tabs button.on{background:var(--or);color:#fff;box-shadow:0 6px 18px #ff6a0055}
h3{font-size:17px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--tx);font:inherit;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .1s}
.card:active{transform:scale(.98)}
.card.on{border-color:var(--or);background:#1f1710}
.card .ic{font-size:26px}
.card b{font-size:16px}
.card span{color:var(--mu);font-size:13px}
.card .ic{color:inherit}
.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.box[hidden],.bar[hidden],section[hidden]{display:none}
label{display:block;color:var(--mu);font-size:13px;font-weight:600;margin-bottom:8px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--tx);font:inherit;font-size:16px;padding:14px}
input:focus-visible,button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.hint{color:var(--mu);font-size:12px;margin-top:6px}
.hint.err{color:#ff7b7b}
.bar{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 30px #0008}
.bar small{color:var(--mu);display:block;font-size:12px}
.bar b{font-size:16px}
.go{background:linear-gradient(135deg,var(--or),var(--or2));border:0;color:#fff;font:inherit;font-weight:700;border-radius:14px;padding:13px 18px;box-shadow:0 8px 20px #ff6a004d;display:block;width:100%}
.bar .go{width:auto}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:8px}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;font-weight:600;display:grid;gap:3px;justify-items:center;padding:6px 0;border-radius:18px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--or)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:15px;overflow-wrap:anywhere}
.stats small{color:var(--mu);font-size:11px}
.me{text-align:center}
.me .av{width:76px;height:76px;font-size:30px;margin:0 auto 10px}
.me h4{font-size:19px}
.me p{color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{color:var(--mu);display:block}
.tag{background:#3a2a0a;color:#ffc861;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:#1c2a1f;border:1px solid #2f5a3a;color:#bff0cb;padding:12px 18px;border-radius:14px;font-weight:600;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>⭐</i>Stars Market</div>
  <div class="pill"><span class="av" id="av">U</span><span id="uname">User</span></div>
</header>
<main>
  <section class="hero" id="hero"></section>

  <section id="v-shop">
    <div class="tabs" id="tabs"></div>
    <h3 id="ptitle"></h3>
    <div class="grid" id="grid"></div>
    <div class="box" id="custombox">
      <label for="custom">Oʻzingiz xohlagan miqdor (kamida 50)</label>
      <input id="custom" type="number" inputmode="numeric" min="50" placeholder="Masalan, 300">
    </div>
    <div class="box">
      <label for="who">Qabul qiluvchi Telegram username</label>
      <input id="who" placeholder="username" autocapitalize="off" autocomplete="off" maxlength="33">
      <div class="hint" id="whohint">5–32 ta belgi: harf, raqam va _</div>
    </div>
  </section>

  <section id="v-history" hidden>
    <h3>Buyurtmalar tarixi</h3>
    <div class="box" id="hist"></div>
  </section>

  <section id="v-help" hidden>
    <div class="box me">
      <h4>Qoʻllab-quvvatlash</h4>
      <p style="margin:8px 0 16px">Savol yoki muammo boʻlsa, admin bilan Telegram orqali bogʻlaning.</p>
      <button class="go" id="support">Telegramda yozish</button>
    </div>
  </section>

  <section id="v-profile" hidden>
    <div class="box me">
      <div class="av" id="av2">U</div>
      <h4 id="pname">Foydalanuvchi</h4>
      <p id="phandle">@username</p>
      <div class="stats">
        <div><b id="pcount">0</b><small>Buyurtma</small></div>
        <div><b id="psum">0 soʻm</b><small>Bajarilgan</small></div>
        <div><b id="pid">—</b><small>Telegram ID</small></div>
      </div>
    </div>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <div><small id="bn"></small><b id="bp"></b></div>
  <button class="go" id="order">Buyurtma berish</button>
</div>

<nav id="nav">
  <button data-v="shop" class="on"><i>🛍</i>Doʻkon</button>
  <button data-v="history"><i>🕘</i>Tarix</button>
  <button data-v="help"><i>🎧</i>Yordam</button>
  <button data-v="profile"><i>👤</i>Profil</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const tg=window.Telegram&&window.Telegram.WebApp;
try{tg&&(tg.ready(),tg.expand())}catch(e){}
const U=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
const ADMIN="Murodov1805";
const API="https://stars-bot-ghii.onrender.com";            // admin username (t.me/...)
let SP=220;                        // namuna: 1 Star narxi (soʻm)
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");

// Namuna narxlar. Keyinchalik admin paneldan (Narxlar) keladi.
const CAT={
 stars:{name:"Stars",icon:"⭐",hero:["Telegram Stars","Kerakli paketni tanlang yoki oʻzingizga kerakli miqdorni kiriting."],bg:"linear-gradient(135deg,#2b1a80,#4c24ad)",title:"Stars paketlari",
  items:[50,100,250,500,1000,2500].map(n=>({id:"s"+n,name:n+" Stars",ic:"⭐",price:n*SP}))},
 premium:{name:"Premium",icon:"💎",hero:["Telegram Premium","Muddatni tanlang, buyurtma tez rasmiylashtiriladi."],bg:"linear-gradient(135deg,#5a2308,#9a3412)",title:"Premium muddatlari",
  items:[[3,170000],[6,230000],[12,400000]].map(([m,p])=>({id:"p"+m,name:m+" oy",ic:"💎",price:p}))},
 gifts:{name:"Giftlar",icon:"🎁",hero:["Telegram giftlar","Doʻstingizga sovgʻa yuboring, u profilida koʻrinadi."],bg:"linear-gradient(135deg,#7a1a4a,#b02a6e)",title:"Giftlar",
  items:[["💝",15],["🧸",15],["🎁",25],["🌹",25],["🎂",50],["💐",50],["🚀",50],["🏆",100]].map(([ic,s],i)=>({id:"g"+i,name:s+" Stars",ic,price:s*SP}))},
 nft:{name:"NFT",icon:"🖼",hero:["NFT giftlar","Noyob giftlar katalogi. Mavjudlari admin tomonidan yangilanadi."],bg:"linear-gradient(135deg,#0b4a52,#0f766e)",title:"NFT giftlar",
  items:[1,2,3,4].map(n=>({id:"n"+n,name:"NFT gift #"+n,ic:"🖼",price:900000*n}))}
};

let tab="stars",sel=null,cur="shop",orders=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Narxlarni bazadan olish (admin paneldagi "Narxlar"). Baza boʻsh yoki xato boʻlsa, yuqoridagi namuna narxlar qoladi.
async function loadPrices(){
  try{
    const rows=await (await fetch(API+"/api/prices")).json();
    if(!Array.isArray(rows)||!rows.length)return;
    const em=n=>{const m=n.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*/u);return m?[m[1],n.slice(m[0].length)]:[null,n]};
    Object.keys(CAT).forEach(k=>{CAT[k].items=rows.filter(p=>p.cat===k).map(p=>{const [ic,nm]=k==="gifts"?em(p.name):[null,p.name];return{id:p.id,name:nm,ic:ic||CAT[k].icon,price:+p.price}})});
    const st=CAT.stars.items.map(i=>({a:parseInt(i.name,10),p:i.price})).filter(x=>x.a>0).sort((x,y)=>x.p-y.p)[0];
    if(st)SP=st.p/st.a;
    sel=null;
  }catch(e){}
}
// Mijozning oʻz buyurtmalari tarixi
async function loadOrders(){
  if(!tg||!tg.initData)return;
  try{
    const r=await fetch(API+"/api/my_orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})});
    if(!r.ok)return;
    orders=(await r.json()).map(o=>({name:o.item,price:o.price,to:o.to_user,date:new Date(o.created_at).toLocaleDateString("uz-UZ"),status:o.status}));
  }catch(e){}
}

function total(){
  const c=+$("#custom").value;
  if(tab==="stars"&&c>=50)return{name:c+" Stars",price:Math.round(c*SP)};
  return sel?{name:sel.name,price:sel.price}:null;
}
function bar(){
  const t=total();
  $("#bar").hidden=!t||cur!=="shop";
  if(t){$("#bn").textContent=t.name;$("#bp").textContent=fmt(t.price)+" soʻm"}
}
function drawShop(){
  const c=CAT[tab];
  $("#hero").style.background=c.bg;
  $("#hero").innerHTML=`<div><h2>${c.hero[0]}</h2><p>${c.hero[1]}</p></div><b>${c.icon}</b>`;
  $("#tabs").innerHTML=Object.keys(CAT).map(k=>`<button data-t="${k}" class="${k===tab?"on":""}">${CAT[k].name}</button>`).join("");
  $("#ptitle").textContent=c.title;
  $("#grid").innerHTML=c.items.map(i=>`<button class="card ${sel&&sel.id===i.id?"on":""}" data-i="${i.id}"><span class="ic">${i.ic}</span><b>${i.name}</b><span>${fmt(i.price)} soʻm</span></button>`).join("");
  if(!c.items.length)$("#grid").innerHTML='<div class="empty" style="grid-column:1/3">Hozircha mavjud emas</div>';
  $("#custombox").hidden=tab!=="stars"||!c.items.length;
  bar();
}
function drawHist(){
  $("#hist").innerHTML=orders.length?orders.map(o=>`<div class="row"><div><b>${esc(o.name)}</b><small>@${esc(o.to)} · ${esc(o.date)}</small></div><div style="text-align:right"><div>${fmt(o.price)} soʻm</div><span class="tag">${esc(o.status)}</span></div></div>`).join(""):`<div class="empty">Hali buyurtma yoʻq. Doʻkondan birinchi buyurtmani bering.</div>`;
}
function drawProfile(){
  const name=[U.first_name,U.last_name].filter(Boolean).join(" ")||"Foydalanuvchi";
  $("#pname").textContent=name;
  $("#phandle").textContent=U.username?"@"+U.username:"@username";
  $("#pid").textContent=U.id||"—";
  $("#pcount").textContent=orders.length;
  $("#psum").textContent=fmt(orders.filter(o=>o.status==="Bajarildi").reduce((a,o)=>a+o.price,0))+" soʻm";
}
function show(v){
  cur=v;
  ["shop","history","help","profile"].forEach(x=>$("#v-"+x).hidden=x!==v);
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="history"){drawHist();loadOrders().then(drawHist)}
  if(v==="profile"){drawProfile();loadOrders().then(drawProfile)}
  bar();
  scrollTo(0,0);
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;sel=null;$("#custom").value="";drawShop()};
$("#grid").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=CAT[tab].items.find(i=>i.id===b.dataset.i);$("#custom").value="";drawShop()};
$("#custom").oninput=()=>{sel=null;drawShop()};
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)};
$("#support").onclick=()=>{const u="https://t.me/"+ADMIN;tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,"_blank")};
$("#order").onclick=async()=>{
  const t=total(),w=$("#who").value.trim().replace(/^@/,""),h=$("#whohint");
  if(!/^\w{5,32}$/.test(w)){h.className="hint err";h.textContent="Username notoʻgʻri: 5–32 ta harf, raqam yoki _ boʻlsin";$("#who").focus();return}
  h.className="hint";h.textContent="5–32 ta belgi: harf, raqam va _";
  if(!tg||!tg.initData){toast("Doʻkonni Telegram ichida oching");return}
  const btn=$("#order");btn.disabled=true;btn.textContent="Yuborilmoqda...";
  try{
    const r=await fetch(API+"/api/order",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({initData:tg.initData,item:t.name,price:t.price,to:w})});
    const d=await r.json();
    if(!d.ok){toast(d.err==="start"?"Avval botda /start bosing":"Xatolik. Qayta urinib koʻring");return}
    orders.unshift({name:t.name,price:t.price,to:w,date:new Date().toLocaleDateString("uz-UZ"),status:"Kutilmoqda"});
    sel=null;$("#custom").value="";drawShop();
    toast("Buyurtma qabul qilindi. Toʻlov maʼlumoti botga yuborildi");
    setTimeout(()=>{try{tg.close()}catch(e){}},1800);
  }catch(e){
    toast("Server javob bermadi. 1 daqiqadan keyin qayta urinib koʻring");
  }finally{
    btn.disabled=false;btn.textContent="Buyurtma berish";
  }
};

{const n=U.first_name||U.username||"User";$("#uname").textContent=n;$("#av").textContent=$("#av2").textContent=n[0].toUpperCase()}
drawShop();
loadPrices().then(drawShop);
loadOrders();
</script>
</body>
</html>
